{% extends "base.html" %}
{% block title %}Add Goal - Finance Analyzer{% endblock %}
{% block content %}
<div class="col-md-3 col-lg-2 d-none d-md-block sidebar p-0">
    <div class="p-3">
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        <a href="{{ url_for('transactions.index') }}">Transactions</a>
        <a href="{{ url_for('budgets.index') }}">Budgets</a>
        <a href="{{ url_for('goals.index') }}" class="fw-bold">Goals</a>
        <a href="#">Analytics</a>
        <a href="#">Reports</a>
    </div>
</div>

<div class="col-md-9 col-lg-10 p-4">
    <h2>Add Financial Goal</h2>
    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Goal Name (e.g., New Laptop, Car Downpayment)</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Target Amount (₹)</label>
                        <input type="number" step="0.01" name="target_amount" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Already Saved (₹) [Optional]</label>
                        <input type="number" step="0.01" name="current_amount" class="form-control" value="0.00">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Target Deadline (Optional)</label>
                    <input type="date" name="deadline" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary mt-2">Save Goal</button>
                <a href="{{ url_for('goals.index') }}" class="btn btn-secondary mt-2 ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
